project:
  type: website
  output-dir: docs
  pre-render:
    - R_scripts/sync_bib.R
  render:
  - "*.qmd"
  - "*.rmd"
  - "*.md"
  - "*.Rmd"
  resources:
    - "files/"
    - "assets/"
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    grid: 
      body-width: 2500px

editor: visual

website:
  title: "Simon Kiss"
  navbar:
    right:
      - text: "Posts"
        href: posts.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Publications"
        href: publications.qmd
